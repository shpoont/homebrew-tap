name: aiasm bottles

on:
  repository_dispatch:
    types:
      - aiasm-release
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to bottle (e.g. v0.1.0)"
        required: true
      revision:
        description: "Git commit SHA for the upstream tag; required unless AIASM_SOURCE_SSH_KEY is configured"
        required: false

permissions:
  contents: write

concurrency:
  group: aiasm-bottles
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare metadata
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    env:
      EVENT_TAG: ${{ github.event.client_payload.tag }}
      EVENT_VERSION: ${{ github.event.client_payload.version }}
      EVENT_REVISION: ${{ github.event.client_payload.revision }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_REVISION: ${{ inputs.revision }}
      AIASM_SOURCE_SSH_KEY: ${{ secrets.AIASM_SOURCE_SSH_KEY }}
    steps:
      - name: Resolve inputs
        id: meta
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [[ -z "${tag}" ]]; then
            echo "::error::Missing release tag."
            exit 1
          fi
          if [[ "${tag}" != v*.*.* ]]; then
            echo "::error::Tag must look like vMAJOR.MINOR.PATCH. Got: ${tag}"
            exit 1
          fi

          version="${EVENT_VERSION:-${tag#v}}"
          if [[ "${version}" != "${tag#v}" ]]; then
            echo "::error::Version '${version}' does not match tag '${tag}'."
            exit 1
          fi

          revision="${EVENT_REVISION:-${INPUT_REVISION:-}}"
          if [[ -z "${revision}" ]]; then
            if [[ -z "${AIASM_SOURCE_SSH_KEY:-}" ]]; then
              echo "::error::Missing revision and AIASM_SOURCE_SSH_KEY."
              echo "::error::Provide the revision input or configure AIASM_SOURCE_SSH_KEY so the workflow can inspect the private repo."
              exit 1
            fi
            install -m 700 -d ~/.ssh
            printf '%s\n' "${AIASM_SOURCE_SSH_KEY}" > ~/.ssh/aiasm_source
            chmod 600 ~/.ssh/aiasm_source
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            {
              echo "Host github.com"
              echo "  IdentityFile ~/.ssh/aiasm_source"
              echo "  IdentitiesOnly yes"
            } >> ~/.ssh/config
            revision="$(git ls-remote ssh://git@github.com/shpoont/aiasm.git "refs/tags/${tag}" | awk '{print $1}')"
          fi

          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid revision: ${revision}"
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "release_tag=aiasm-${version}" >> "$GITHUB_OUTPUT"

  build-bottles:
    name: build ${{ matrix.os }}
    needs:
      - prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-26
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REVISION: ${{ needs.prepare.outputs.revision }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      AIASM_SOURCE_SSH_KEY: ${{ secrets.AIASM_SOURCE_SSH_KEY }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure private source SSH
        run: |
          set -euo pipefail
          if [[ -z "${AIASM_SOURCE_SSH_KEY:-}" ]]; then
            echo "::error::Missing secret AIASM_SOURCE_SSH_KEY."
            echo "::error::Store an SSH private key that can read shpoont/aiasm in shpoont/homebrew-tap."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${AIASM_SOURCE_SSH_KEY}" > ~/.ssh/aiasm_source
          chmod 600 ~/.ssh/aiasm_source
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          {
            echo "Host github.com"
            echo "  IdentityFile ~/.ssh/aiasm_source"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Update formula source fields
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/aiasm.rb")
          text = path.read_text()
          version = os.environ["VERSION"]
          revision = os.environ["REVISION"]
          head_line = '  head "ssh://git@github.com/shpoont/aiasm.git", branch: "main"\n'
          stable_block = (
              f'  url "ssh://git@github.com/shpoont/aiasm.git",\n'
              f'      tag:      "v{version}",\n'
              f'      revision: "{revision}"\n\n'
          )

          stable_re = re.compile(
              r'  url "ssh://git@github\.com/shpoont/aiasm\.git",\n'
              r'      tag:      "v[^"]+",\n'
              r'      revision: "[0-9a-f]{40}"\n\n'
          )
          if stable_re.search(text):
              text = stable_re.sub(stable_block, text, count=1)
          else:
              if head_line not in text:
                  raise SystemExit("AIASM head line not found")
              text = text.replace(head_line, stable_block + head_line, 1)

          text = re.sub(r'\n  bottle do\n.*?\n  end\n', '\n', text, count=1, flags=re.S)
          text = text.replace("\n\n\n  depends_on", "\n\n  depends_on")
          path.write_text(text)
          PY

      - name: Build bottle
        run: |
          set -euo pipefail
          if brew list --versions aiasm >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies aiasm
          fi
          brew install --build-bottle shpoont/tap/aiasm
          brew test shpoont/tap/aiasm

      - name: Create bottle archive + json
        run: |
          set -euo pipefail
          brew bottle --json --root-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" shpoont/tap/aiasm

          python3 - <<'PY'
          import glob
          import json
          import os

          json_files = glob.glob("aiasm--*.bottle.json")
          if len(json_files) != 1:
              raise SystemExit(f"Expected exactly one bottle JSON file, got: {json_files}")

          with open(json_files[0], "r", encoding="utf-8") as fh:
              payload = json.load(fh)

          key = next(iter(payload))
          tags = payload[key]["bottle"]["tags"]
          if len(tags) != 1:
              raise SystemExit(f"Expected one bottle tag, got: {list(tags.keys())}")

          info = next(iter(tags.values()))
          local_filename = info.get("local_filename")
          filename = info["filename"]

          if local_filename and os.path.exists(local_filename) and local_filename != filename:
              os.rename(local_filename, filename)

          if not os.path.exists(filename):
              raise SystemExit(f"Bottle archive not found: {filename}")
          PY

          mkdir -p bottle-artifacts
          mv aiasm*.bottle*.tar.gz bottle-artifacts/
          mv aiasm--*.bottle.json bottle-artifacts/

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ matrix.os }}
          path: bottle-artifacts/*
          if-no-files-found: error

  publish:
    name: publish bottles + update formula
    needs:
      - prepare
      - build-bottles
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REVISION: ${{ needs.prepare.outputs.revision }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bottle artifacts
        uses: actions/download-artifact@v4
        with:
          path: bottle-artifacts
          pattern: bottles-*
          merge-multiple: true

      - name: Validate downloaded artifacts
        run: |
          set -euo pipefail
          ls -lah bottle-artifacts
          json_count="$(find bottle-artifacts -type f -name '*.json' | wc -l | tr -d ' ')"
          tgz_count="$(find bottle-artifacts -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [[ "${json_count}" == "0" || "${tgz_count}" == "0" ]]; then
            echo "::error::Expected JSON and bottle archives in bottle-artifacts."
            exit 1
          fi

      - name: Update formula source fields
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/aiasm.rb")
          text = path.read_text()
          version = os.environ["VERSION"]
          revision = os.environ["REVISION"]
          head_line = '  head "ssh://git@github.com/shpoont/aiasm.git", branch: "main"\n'
          stable_block = (
              f'  url "ssh://git@github.com/shpoont/aiasm.git",\n'
              f'      tag:      "v{version}",\n'
              f'      revision: "{revision}"\n\n'
          )

          stable_re = re.compile(
              r'  url "ssh://git@github\.com/shpoont/aiasm\.git",\n'
              r'      tag:      "v[^"]+",\n'
              r'      revision: "[0-9a-f]{40}"\n\n'
          )
          if stable_re.search(text):
              text = stable_re.sub(stable_block, text, count=1)
          else:
              if head_line not in text:
                  raise SystemExit("AIASM head line not found")
              text = text.replace(head_line, stable_block + head_line, 1)

          text = re.sub(r'\n  bottle do\n.*?\n  end\n', '\n', text, count=1, flags=re.S)
          text = text.replace("\n\n\n  depends_on", "\n\n  depends_on")
          path.write_text(text)
          PY

      - name: Merge bottle metadata into formula
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path

          files = sorted(glob.glob("bottle-artifacts/*.json"))
          if not files:
              raise SystemExit("No bottle JSON files found")

          merged = None
          merged_key = None
          for json_path in files:
              with open(json_path, "r", encoding="utf-8") as fh:
                  data = json.load(fh)

              key = next(iter(data))
              if merged is None:
                  merged = data
                  merged_key = key
                  continue

              if key != merged_key:
                  raise SystemExit(f"Mismatched formula key: {key} != {merged_key}")

              merged_tags = merged[merged_key]["bottle"]["tags"]
              merged_tags.update(data[key]["bottle"]["tags"])

          merged_tags = merged[merged_key]["bottle"]["tags"]
          merged[merged_key]["bottle"]["tags"] = {k: merged_tags[k] for k in sorted(merged_tags)}

          out = Path("bottle-artifacts/merged.json")
          out.write_text(json.dumps(merged, indent=2) + "\n", encoding="utf-8")
          PY

          brew bottle --merge --write --no-commit bottle-artifacts/merged.json

          python3 - <<'PY'
          from pathlib import Path
          path = Path("Formula/aiasm.rb")
          text = path.read_text()
          text = text.replace("\n\n\n  depends_on", "\n\n  depends_on")
          path.write_text(text)
          PY

      - name: Publish bottle archives to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find bottle-artifacts -maxdepth 1 -type f -name '*.tar.gz' | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No bottle assets to upload."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --title "aiasm ${VERSION} bottles" \
              --notes "Automated bottle release for aiasm ${VERSION}."
          fi

      - name: Validate formula syntax and style
        run: |
          set -euo pipefail
          ruby -c Formula/aiasm.rb
          brew style Formula/aiasm.rb

      - name: Commit and push formula update
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/aiasm.rb; then
            echo "No formula changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/aiasm.rb
          git commit -m "aiasm ${VERSION} bottles"
          git push origin HEAD:master
