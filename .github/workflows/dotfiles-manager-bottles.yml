name: dotfiles-manager bottles

on:
  repository_dispatch:
    types:
      - dotfiles-manager-release
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to bottle (e.g. v0.1.2)"
        required: true
      source_sha256:
        description: "Optional SHA256 for upstream source tarball"
        required: false
      source_commit:
        description: "Required 40-character upstream commit SHA"
        required: true
      source_date:
        description: "Required upstream commit date as UTC RFC3339 Z"
        required: true
      channel:
        description: "Optional release channel; derived from tag when omitted"
        required: false
      provenance:
        description: "Build metadata provenance"
        required: false
        default: "homebrew-source"

permissions:
  contents: write

concurrency:
  group: dotfiles-manager-bottles
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare metadata
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      source_sha256: ${{ steps.meta.outputs.source_sha256 }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
      source_date: ${{ steps.meta.outputs.source_date }}
      channel: ${{ steps.meta.outputs.channel }}
      provenance: ${{ steps.meta.outputs.provenance }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    env:
      EVENT_TAG: ${{ github.event.client_payload.tag }}
      EVENT_VERSION: ${{ github.event.client_payload.version }}
      EVENT_SHA256: ${{ github.event.client_payload.source_sha256 }}
      EVENT_COMMIT: ${{ github.event.client_payload.source_commit }}
      EVENT_DATE: ${{ github.event.client_payload.source_date }}
      EVENT_CHANNEL: ${{ github.event.client_payload.channel }}
      EVENT_PROVENANCE: ${{ github.event.client_payload.provenance }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_SHA256: ${{ inputs.source_sha256 }}
      INPUT_COMMIT: ${{ inputs.source_commit }}
      INPUT_DATE: ${{ inputs.source_date }}
      INPUT_CHANNEL: ${{ inputs.channel }}
      INPUT_PROVENANCE: ${{ inputs.provenance }}
    steps:
      - name: Resolve inputs
        id: meta
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [[ -z "${tag}" ]]; then
            echo "::error::Missing release tag."
            exit 1
          fi
          if [[ "${tag}" != v* ]]; then
            echo "::error::Tag must start with v. Got: ${tag}"
            exit 1
          fi

          version="${EVENT_VERSION:-${tag#v}}"
          if [[ "${version}" != "${tag#v}" ]]; then
            echo "::error::Version '${version}' does not match tag '${tag}'."
            exit 1
          fi

          source_sha256="${EVENT_SHA256:-${INPUT_SHA256:-}}"
          if [[ -z "${source_sha256}" ]]; then
            curl -fsSL "https://github.com/shpoont/dotfiles-manager/archive/refs/tags/${tag}.tar.gz" -o source.tar.gz
            source_sha256="$(sha256sum source.tar.gz | awk '{print $1}')"
          fi

          if [[ ! "${source_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid source sha256: ${source_sha256}"
            exit 1
          fi

          source_commit="${EVENT_COMMIT:-${INPUT_COMMIT:-}}"
          source_date="${EVENT_DATE:-${INPUT_DATE:-}}"
          channel="${EVENT_CHANNEL:-${INPUT_CHANNEL:-}}"
          provenance="${EVENT_PROVENANCE:-${INPUT_PROVENANCE:-homebrew-source}}"

          expected_channel="stable"
          if [[ "${version}" == *-* ]]; then
            expected_channel="prerelease"
          fi
          if [[ -z "${channel}" ]]; then
            channel="${expected_channel}"
          fi

          if [[ ! "${source_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing or invalid source commit SHA. Refusing to publish unknown Homebrew metadata."
            exit 1
          fi
          if [[ ! "${source_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::Missing or invalid source date. Refusing to publish unknown Homebrew metadata."
            exit 1
          fi
          case "${channel}" in
            stable|prerelease) ;;
            *)
              echo "::error::Invalid channel: ${channel}"
              exit 1
              ;;
          esac
          if [[ "${channel}" != "${expected_channel}" ]]; then
            echo "::error::Channel '${channel}' does not match tag-derived channel '${expected_channel}'."
            exit 1
          fi
          if [[ "${provenance}" != "homebrew-source" ]]; then
            echo "::error::Invalid provenance '${provenance}'. dotfiles-manager tap builds must use homebrew-source."
            exit 1
          fi

          rm -rf upstream-check
          git init -q upstream-check
          git -C upstream-check fetch -q --depth=1 https://github.com/shpoont/dotfiles-manager.git "refs/tags/${tag}:refs/tags/${tag}"
          resolved_commit="$(git -C upstream-check rev-list -n 1 "refs/tags/${tag}")"
          resolved_commit_date="$(git -C upstream-check show -s --format=%cI "${resolved_commit}")"
          resolved_date="$(date -u -d "${resolved_commit_date}" '+%Y-%m-%dT%H:%M:%SZ')"
          if [[ "${source_commit}" != "${resolved_commit}" ]]; then
            echo "::error::Source commit '${source_commit}' does not match upstream tag commit '${resolved_commit}'."
            exit 1
          fi
          if [[ "${source_date}" != "${resolved_date}" ]]; then
            echo "::error::Source date '${source_date}' does not match upstream tag commit date '${resolved_date}'."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "source_sha256=${source_sha256}" >> "$GITHUB_OUTPUT"
          echo "source_commit=${source_commit}" >> "$GITHUB_OUTPUT"
          echo "source_date=${source_date}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "provenance=${provenance}" >> "$GITHUB_OUTPUT"
          echo "release_tag=dotfiles-manager-${version}" >> "$GITHUB_OUTPUT"

  build-bottles:
    name: build ${{ matrix.os }}
    needs:
      - prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-15-intel
          - macos-26
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA256: ${{ needs.prepare.outputs.source_sha256 }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      SOURCE_DATE: ${{ needs.prepare.outputs.source_date }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      PROVENANCE: ${{ needs.prepare.outputs.provenance }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formula source fields
        run: |
          set -euo pipefail
          python3 scripts/update_dotfiles_manager_formula.py \
            --formula Formula/dotfiles-manager.rb \
            --version "${VERSION}" \
            --source-sha256 "${SOURCE_SHA256}" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-date "${SOURCE_DATE}" \
            --channel "${CHANNEL}" \
            --provenance "${PROVENANCE}" \
            --drop-bottle

      - name: Sync formula into active Homebrew tap
        run: |
          set -euo pipefail
          brew tap shpoont/tap "https://github.com/shpoont/homebrew-tap"
          tap_repo="$(brew --repo shpoont/tap)"
          if ! cmp -s Formula/dotfiles-manager.rb "${tap_repo}/Formula/dotfiles-manager.rb"; then
            cp Formula/dotfiles-manager.rb "${tap_repo}/Formula/dotfiles-manager.rb"
          fi

      - name: Build bottle
        run: |
          set -euo pipefail
          if brew list --versions dotfiles-manager >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies dotfiles-manager
          fi
          brew install --build-bottle shpoont/tap/dotfiles-manager

      - name: Validate built formula metadata
        run: |
          set -euo pipefail
          brew test shpoont/tap/dotfiles-manager

      - name: Create bottle archive + json
        run: |
          set -euo pipefail
          brew bottle --json --root-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" shpoont/tap/dotfiles-manager

          python3 - <<'PY'
          import glob
          import json
          import os

          json_files = glob.glob("dotfiles-manager--*.bottle.json")
          if len(json_files) != 1:
              raise SystemExit(f"Expected exactly one bottle JSON file, got: {json_files}")

          with open(json_files[0], "r", encoding="utf-8") as fh:
              payload = json.load(fh)

          key = next(iter(payload))
          tags = payload[key]["bottle"]["tags"]
          if len(tags) != 1:
              raise SystemExit(f"Expected one bottle tag, got: {list(tags.keys())}")

          info = next(iter(tags.values()))
          local_filename = info.get("local_filename")
          filename = info["filename"]

          if local_filename and os.path.exists(local_filename) and local_filename != filename:
              os.rename(local_filename, filename)

          if not os.path.exists(filename):
              raise SystemExit(f"Bottle archive not found: {filename}")
          PY

          mkdir -p bottle-artifacts
          mv dotfiles-manager*.bottle*.tar.gz bottle-artifacts/
          mv dotfiles-manager--*.bottle.json bottle-artifacts/

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ matrix.os }}
          path: bottle-artifacts/*
          if-no-files-found: error

  publish:
    name: publish bottles + update formula
    needs:
      - prepare
      - build-bottles
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA256: ${{ needs.prepare.outputs.source_sha256 }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      SOURCE_DATE: ${{ needs.prepare.outputs.source_date }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      PROVENANCE: ${{ needs.prepare.outputs.provenance }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bottle artifacts
        uses: actions/download-artifact@v4
        with:
          path: bottle-artifacts
          pattern: bottles-*
          merge-multiple: true

      - name: Validate downloaded artifacts
        run: |
          set -euo pipefail
          ls -lah bottle-artifacts
          json_count="$(find bottle-artifacts -type f -name '*.json' | wc -l | tr -d ' ')"
          tgz_count="$(find bottle-artifacts -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [[ "${json_count}" == "0" || "${tgz_count}" == "0" ]]; then
            echo "::error::Expected JSON and bottle archives in bottle-artifacts."
            exit 1
          fi

      - name: Update formula source fields
        run: |
          set -euo pipefail
          python3 scripts/update_dotfiles_manager_formula.py \
            --formula Formula/dotfiles-manager.rb \
            --version "${VERSION}" \
            --source-sha256 "${SOURCE_SHA256}" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-date "${SOURCE_DATE}" \
            --channel "${CHANNEL}" \
            --provenance "${PROVENANCE}" \
            --drop-bottle

      - name: Merge bottle metadata into formula
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          from pathlib import Path

          files = sorted(glob.glob("bottle-artifacts/*.json"))
          if not files:
              raise SystemExit("No bottle JSON files found")

          merged = None
          merged_key = None
          for json_path in files:
              with open(json_path, "r", encoding="utf-8") as fh:
                  data = json.load(fh)

              key = next(iter(data))
              if merged is None:
                  merged = data
                  merged_key = key
                  continue

              if key != merged_key:
                  raise SystemExit(f"Mismatched formula key: {key} != {merged_key}")

              merged_tags = merged[merged_key]["bottle"]["tags"]
              merged_tags.update(data[key]["bottle"]["tags"])

          merged_tags = merged[merged_key]["bottle"]["tags"]
          merged[merged_key]["bottle"]["tags"] = {k: merged_tags[k] for k in sorted(merged_tags)}

          out = Path("bottle-artifacts/merged.json")
          out.write_text(json.dumps(merged, indent=2) + "\n", encoding="utf-8")
          PY

          brew bottle --merge --write --no-commit bottle-artifacts/merged.json

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Formula/dotfiles-manager.rb")
          text = path.read_text()
          text = text.replace("\n\n\n  depends_on", "\n\n  depends_on")
          path.write_text(text)
          PY

      - name: Assert final formula metadata contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          text = Path("Formula/dotfiles-manager.rb").read_text()
          expected = [
              f'BUILD_COMMIT = "{os.environ["SOURCE_COMMIT"]}"',
              f'BUILD_DATE = "{os.environ["SOURCE_DATE"]}"',
              f'BUILD_CHANNEL = "{os.environ["CHANNEL"]}"',
              'BUILD_PROVENANCE = "homebrew-source"',
              'buildVersion=#{version}',
              'buildCommit=#{BUILD_COMMIT}',
              'buildDate=#{BUILD_DATE}',
              'buildChannel=#{BUILD_CHANNEL}',
              'buildProvenance=#{BUILD_PROVENANCE}',
              'refute_match "version=dev"',
              'refute_match "commit=unknown"',
              'refute_match "date=unknown"',
              'refute_match "channel=dev"',
              'refute_match "provenance=unspecified"',
          ]
          missing = [needle for needle in expected if needle not in text]
          if missing:
              raise SystemExit("Formula is missing metadata contract entries: " + ", ".join(missing))
          PY

      - name: Sync formula into active Homebrew tap
        run: |
          set -euo pipefail
          brew tap shpoont/tap "https://github.com/shpoont/homebrew-tap"
          tap_repo="$(brew --repo shpoont/tap)"
          if ! cmp -s Formula/dotfiles-manager.rb "${tap_repo}/Formula/dotfiles-manager.rb"; then
            cp Formula/dotfiles-manager.rb "${tap_repo}/Formula/dotfiles-manager.rb"
          fi

      - name: Validate formula
        run: |
          set -euo pipefail
          brew audit --strict shpoont/tap/dotfiles-manager
          if brew list --versions dotfiles-manager >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies dotfiles-manager
          fi
          brew install --build-from-source shpoont/tap/dotfiles-manager
          brew test shpoont/tap/dotfiles-manager

      - name: Publish bottle archives to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find bottle-artifacts -maxdepth 1 -type f -name '*.tar.gz' | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No bottle assets to upload."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --title "dotfiles-manager ${VERSION} bottles" \
              --notes "Automated bottle release for dotfiles-manager ${VERSION}."
          fi

      - name: Commit and push formula update
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/dotfiles-manager.rb; then
            echo "No formula changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dotfiles-manager.rb
          git commit -m "dotfiles-manager ${VERSION} bottles"
          git push origin HEAD:master
